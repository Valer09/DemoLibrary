spring:
  application:
    name: DemoLibrary
  datasource:
    url: jdbc:h2:mem:demoLibraryDb;
    driverClassName: org.h2.Driver
    username: sa
    password: password
    platform: h2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resource-server:
        jwt:
          audiences:
            - ${JWT_AUDIENCE}
          issuer-uri: ${JWT_ISSUER_URL}

auth0:
  domain: ${AUTH0_DOMAIN}
  token-url: ${AUTH0_TOKEN_URL}
  client-id: ${AUTH0_CLIENT_ID}
  client-secret: ${AUTH0_CLIENT_SECRET}
  audience: ${AUTH0_AUDIENCE