spring:
  application:
    name: DemoLibrary
  datasource:
    url: jdbc:sqlserver://127.0.0.1:1434;encrypt=true;trustServerCertificate=true;databaseName=DemoLibrary
    username: demoLibraryUser
    password: password
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.SQLServerDialect
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resource-server:
        jwt:
          audiences:
            - https://DemoLibraryAuthApi
          issuer-uri: https://dev-ijzwld8inlw3zyy2.eu.auth0.com/

auth0:
  domain: ${AUTH0_DOMAIN}
  token-url: ${AUTH0_TOKEN_URL}
  client-id: ${AUTH0_CLIENT_ID}
  client-secret: ${AUTH0_CLIENT_SECRET}
  audience: ${AUTH0_AUDIENCE
